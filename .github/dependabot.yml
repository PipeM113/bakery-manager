version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # One pull request per week with the minor and patch updates: separate ones all touch package-lock.json
    # and conflict with each other as soon as one is merged.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # ESLint 10 needs eslint, @eslint/js, typescript-eslint and the plugins to move together (a major
      # update of @eslint/js alone does not install). Do it by hand as one task.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 rewrites the config and the styles of the whole app: its own task, not a bot PR.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # The types follow the Node version the project runs (22), not the latest major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 7.1 turns on rules (set-state-in-effect, refs) that flag 4 existing effects: a task of its own.
      - dependency-name: "eslint-plugin-react-hooks"
        versions: [">=7.1.0"]
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
