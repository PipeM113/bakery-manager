version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # One pull request per week with the minor and patch updates: separate ones all touch package-lock.json
    # and conflict with each other as soon as one is merged.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # ESLint 10 needs eslint, @eslint/js, typescript-eslint and the plugins to move together (a major
      # update of @eslint/js alone does not install). Do it by hand as one task.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
