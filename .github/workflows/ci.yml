name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Throwaway database of the service above; the tests refuse any non-local host.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54330/postgres
    steps:
      # Pinned to a full commit SHA (the tag is in the comment): a moved tag cannot swap
      # the code that runs in CI. SHA taken from the verified sources, see docs/fuentes.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Go comes preinstalled on the runner; go.mod's "go" line makes it fetch the exact
      # toolchain it needs (GOTOOLCHAIN=auto). Not pinned by SHA because no setup action is used.
      - run: go version
      - run: go vet ./...
      - run: go test -count=1 ./...

  frontend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      # Placeholder: the build only checks that it is a valid URL.
      VITE_API_URL: https://api.example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
