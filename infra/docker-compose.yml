# Local Postgres used ONLY by the test suite (throwaway data, test credentials).
# Start:  docker compose -f infra/docker-compose.yml up -d --wait
# Stop:   docker compose -f infra/docker-compose.yml down -v
# Then:   export TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:54330/postgres
services:
  db:
    image: postgres:16
    # Throwaway test data: skip disk syncs so creating and dropping databases is fast.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # 54330 so it does not clash with the Angeles Bakery test database (54329).
      - "127.0.0.1:54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
